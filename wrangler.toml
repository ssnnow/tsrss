name = "tsrss"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Serve TSRSS from the existing proxied apex domain without replacing DNS.
routes = [
  { pattern = "masbhd.com/*", zone_name = "masbhd.com" }
]

# Auto-serve static assets (JS, CSS, favicons, app.html)
assets = { directory = "./src/public", binding = "ASSETS" }

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "tsrss-db"
database_id = "4201c720-5954-417e-a330-8466920a7000"

# KV namespace for password auth sessions
[[kv_namespaces]]
binding = "SESSIONS"
id = "d2424c767e23426688ffaca5103c9cf5"

# Cron trigger: refresh all feeds every 30 minutes
[triggers]
crons = ["*/30 * * * *"]

# Environment variables
[vars]
TSRSS_AUTH_MODE = "password"
TSRSS_PURGE_DAYS = "30"
TSRSS_VERSION = "vDev"

# ── Preview environment ──────────────────────────────────────────────────────

[env.preview]
name = "tsrss-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "tsrss-preview-db"
database_id = "__PREVIEW_D1_DATABASE_ID__"

[[env.preview.kv_namespaces]]
binding = "SESSIONS"
id = "__PREVIEW_KV_NAMESPACE_ID__"

# Preview cron disabled — preview is for manual testing only
[env.preview.triggers]
crons = []

[env.preview.vars]
TSRSS_AUTH_MODE = "password"
TSRSS_PURGE_DAYS = "30"
TSRSS_VERSION = "vDev"
